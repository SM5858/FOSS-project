<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Highlight &amp; Translate - PDF Viewer</title>
  <link rel="stylesheet" href="viewer.css" />
  <link rel="stylesheet" href="content.css" />
</head>
<body>
  <div id="topbar">
    <span id="statusText">Loading PDF…</span>
    <div id="progressTrack"><div id="progressFill"></div></div>
  </div>

  <div id="pageContainer"></div>

  <!-- Locally bundled Tesseract.js (UMD format, exposes global Tesseract object) -->
  <script src="lib/tesseract/tesseract.min.js"></script>
  <!-- Shared dictionary popup renderer (also used by content.js, exposes global window.HTDict) -->
  <script src="lib/dict-render.js"></script>
  <!-- Locally bundled pdf.js + main logic (MV3 disallows remote code execution, everything is local) -->
  <script type="module" src="viewer.js"></script>
</body>
</html>
