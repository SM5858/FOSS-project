<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 220px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      padding: 14px;
      margin: 0;
    }
    h2 { font-size: 14px; margin: 0 0 12px; }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 13px;
    }
    select {
      font-size: 12px;
      padding: 4px 6px;
      border-radius: 5px;
      border: 1px solid #d1d5db;
    }
    .switch {
      position: relative;
      width: 36px;
      height: 20px;
      display: inline-block;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #d1d5db;
      transition: 0.2s;
      border-radius: 20px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
    }
    input:checked + .slider { background-color: #2563eb; }
    input:checked + .slider:before { transform: translateX(16px); }
    a.options-link {
      display: block;
      margin-top: 10px;
      font-size: 12px;
      color: #2563eb;
      text-decoration: none;
    }
    a.options-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <h2>Highlight &amp; Translate</h2>

  <div class="row">
    <span>Enable extension</span>
    <label class="switch">
      <input type="checkbox" id="enabledToggle" />
      <span class="slider"></span>
    </label>
  </div>

  <div class="row">
    <span>Target language</span>
    <select id="langSelect"></select>
  </div>

  <a class="options-link" href="options.html" target="_blank">API Key settings →</a>

  <script src="lib/dict-render.js"></script>
  <script src="popup.js"></script>
</body>
</html>
