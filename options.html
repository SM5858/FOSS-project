<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>划词悬浮翻译 - 设置</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      max-width: 480px;
      margin: 40px auto;
      color: #1a1a1a;
    }
    h1 { font-size: 18px; margin-bottom: 4px; }
    p.desc { color: #6b7280; font-size: 13px; margin-top: 0; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 16px 0 6px; }
    input[type="text"], select {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
      box-sizing: border-box;
    }
    .radio-row { display: flex; gap: 16px; font-size: 13px; margin-top: 4px; }
    .radio-row label { display: flex; align-items: center; gap: 6px; font-weight: 400; margin: 0; }
    button {
      margin-top: 20px;
      padding: 9px 18px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    #status { margin-top: 10px; font-size: 12px; color: #059669; }
    .hint { font-size: 12px; color: #9ca3af; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>划词悬浮翻译 - 设置</h1>
  <p class="desc">配置翻译服务的 API Key 和默认目标语言</p>

  <label for="apiKey">DeepL API Key</label>
  <input type="text" id="apiKey" placeholder="在 deepl.com 注册后获取" />
  <div class="hint">免费版key结尾通常带 :fx，前往 deepl.com/pro-api 获取</div>

  <label>账号类型</label>
  <div class="radio-row">
    <label><input type="radio" name="plan" value="free" checked /> Free</label>
    <label><input type="radio" name="plan" value="pro" /> Pro</label>
  </div>

  <label for="targetLang">默认目标语言</label>
  <select id="targetLang">
    <option value="ZH">中文</option>
    <option value="EN-US">English</option>
    <option value="JA">日本語</option>
    <option value="KO">한국어</option>
    <option value="FR">Français</option>
    <option value="DE">Deutsch</option>
    <option value="ES">Español</option>
  </select>

  <div>
    <button id="saveBtn">保存设置</button>
  </div>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
